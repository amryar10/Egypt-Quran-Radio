<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Egypt Quran Radio By amryar10</title>
<style>
  :root {
    --bg: #0b1120;
    --bg-glow: #172554;
    --card: #131c31;
    --surface: rgba(255, 255, 255, 0.05);
    --surface-hover: rgba(255, 255, 255, 0.1);
    --border: rgba(255, 255, 255, 0.09);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #06b6d4;
    --accent-hover: #0891b2;
    --accent-text: #082f49;
    --stop-bg: rgba(248, 113, 113, 0.14);
    --stop-text: #f87171;
    --stop-hover: rgba(248, 113, 113, 0.24);
    --stop-border: rgba(248, 113, 113, 0.22);
    --live: #22c55e;
    --shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
  }

  body.light {
    --bg: #f1f5f9;
    --bg-glow: #e0f2fe;
    --card: #ffffff;
    --surface: rgba(15, 23, 42, 0.05);
    --surface-hover: rgba(15, 23, 42, 0.1);
    --border: rgba(15, 23, 42, 0.1);
    --text: #0f172a;
    --muted: #64748b;
    --stop-bg: rgba(239, 68, 68, 0.1);
    --stop-text: #dc2626;
    --stop-hover: rgba(239, 68, 68, 0.18);
    --stop-border: rgba(239, 68, 68, 0.22);
    --shadow: 0 20px 40px rgba(15, 23, 42, 0.1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at top, var(--bg-glow) 0%, var(--bg) 68%);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .player-card {
    width: 100%;
    max-width: 340px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 18px 22px 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    position: relative;
    transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .color-picker {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .swatch {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .swatch:hover {
    transform: scale(1.18);
  }

  .swatch.active {
    border-color: var(--text);
    transform: scale(1.15);
  }

  .theme-btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 0.2s ease, transform 0.12s ease;
  }

  .theme-btn:hover {
    background: var(--surface-hover);
  }

  .icon-wrap {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    background: var(--surface);
    border: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    position: relative;
    overflow: hidden;
    transition: border-color 0.25s ease, box-shadow 0.3s ease;
  }

  .icon-wrap.is-playing {
    box-shadow: 0 0 22px rgba(56, 189, 248, 0.22);
  }

  .icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 12px;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .icon-wrap.is-playing img {
    opacity: 0;
    transform: scale(0.85);
  }

  #waveCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .icon-wrap.is-playing #waveCanvas {
    opacity: 1;
  }

  .title-block {
    text-align: center;
  }

  h1 {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 3px;
  }

  .subtitle {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--surface);
    font-size: 0.8rem;
    color: var(--muted);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.25s ease;
  }

  .dot.live {
    background: var(--live);
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
    animation: pulse 1.6s infinite;
  }

  .dot.loading {
    background: var(--accent);
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
    70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }

  .controls {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .ctrl-btn {
    border: none;
    border-radius: 14px;
    padding: 13px 16px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.12s ease, background 0.2s ease, opacity 0.2s ease;
  }

  .ctrl-btn:active {
    transform: scale(0.97);
  }

  .ctrl-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }

  .btn-play {
    background: var(--accent);
    color: var(--accent-text);
  }

  .btn-play:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .btn-stop {
    background: var(--stop-bg);
    color: var(--stop-text);
    border: 1px solid var(--stop-border);
  }

  .btn-stop:hover:not(:disabled) {
    background: var(--stop-hover);
  }

  .volume-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 5px;
    border-radius: 999px;
    background: var(--surface-hover);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    transition: background 0.2s ease;
  }

  .about-btn {
    margin-top: 2px;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 0.74rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .about-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.65);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-card {
    width: 100%;
    max-width: 290px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 20px;
    text-align: center;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .modal-card img {
    width: 52px;
    height: 52px;
    object-fit: contain;
  }

  .modal-title {
    font-size: 1rem;
    font-weight: 700;
  }

  .modal-dev {
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
  }

  .modal-note {
    font-size: 0.76rem;
    color: var(--muted);
    line-height: 1.4;
  }

  .modal-close {
    margin-top: 6px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 8px 20px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }

  .modal-close:hover {
    background: var(--accent-hover);
  }
</style>
</head>

      green:  { accent: "#22c55e", hover: "#16a34a", text: "#052e16", glowDark: "#052e16", glowLight: "#dcfce7" },
      blue:   { accent: "#3b82f6", hover: "#2563eb", text: "#ffffff", glowDark: "#172554", glowLight: "#dbeafe" },
      cyan:   { accent: "#06b6d4", hover: "#0891b2", text: "#082f49", glowDark: "#083344", glowLight: "#cffafe" },
      pink:   { accent: "#ec4899", hover: "#db2777", text: "#ffffff", glowDark: "#500724", glowLight: "#fce7f3" },
      yellow: { accent: "#eab308", hover: "#ca8a04", text: "#422006", glowDark: "#422006", glowLight: "#fef9c3" }
    };

    const SUN_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
    const MOON_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

    const audio = document.getElementById("radioAudio");
    const playBtn = document.getElementById("playBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const themeIcon = document.getElementById("themeIcon");
    const themeLabel = document.getElementById("themeLabel");
    const aboutModal = document.getElementById("aboutModal");
    const iconWrap = document.getElementById("iconWrap");
    const waveCanvas = document.getElementById("waveCanvas");
    const waveCtx = waveCanvas.getContext("2d");

    const COLOR_KEYS = Object.keys(COLOR_PALETTES);
    const systemLightMedia = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;

    let triedFallback = false;
    let isStoppedByUser = true;
    let waveMode = "idle"; // "idle" | "loading" | "live"
    let waveAnimId = null;
    let currentTheme = (systemLightMedia && systemLightMedia.matches) ? "light" : "dark";
    let currentColor = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];

    if (systemLightMedia && systemLightMedia.addEventListener) {
      systemLightMedia.addEventListener("change", (e) => {
        currentTheme = e.matches ? "light" : "dark";
        applyAppearance();
      });
    }

    const BAR_COUNT = 7;
    const barHeights = new Array(BAR_COUNT).fill(0.18);
    const barTargets = new Array(BAR_COUNT).fill(0.18);

    audio.volume = 0.85;

    function getAccentColor() {
      return (COLOR_PALETTES[currentColor] || COLOR_PALETTES.cyan).accent;
    }

    function drawWave(ts) {
      const w = waveCanvas.width;
      const h = waveCanvas.height;
      waveCtx.clearRect(0, 0, w, h);

      if (waveMode === "idle") {
        waveAnimId = null;
        return;
      }

      const accent = getAccentColor();
      const volScale = 0.35 + audio.volume * 0.65;
      const t = ts * 0.005;
      const barWidth = 10;
      const gap = 8;
      const totalWidth = BAR_COUNT * barWidth + (BAR_COUNT - 1) * gap;
      const startX = (w - totalWidth) / 2;
      const maxBarH = h * 0.62;
      const minBarH = 12;

      waveCtx.fillStyle = accent;

      for (let i = 0; i < BAR_COUNT; i++) {
        if (waveMode === "live") {
          const envelope = 1 - Math.abs(i - (BAR_COUNT - 1) / 2) * 0.12;
          const wave1 = Math.sin(t * (1.4 + i * 0.27) + i * 1.1) * 0.5 + 0.5;
          const wave2 = Math.cos(t * 2.3 - i * 0.8) * 0.5 + 0.5;
          barTargets[i] = Math.max(0.15, (0.25 + 0.75 * (wave1 * 0.6 + wave2 * 0.4)) * envelope * volScale);
        } else {
          const pulse = Math.sin(t * 1.3 - i * 0.5) * 0.5 + 0.5;
          barTargets[i] = 0.15 + pulse * 0.25;
        }

        barHeights[i] += (barTargets[i] - barHeights[i]) * 0.22;
        const bh = minBarH + barHeights[i] * (maxBarH - minBarH);
        const x = startX + i * (barWidth + gap);
        const y = (h - bh) / 2;
        const r = barWidth / 2;

        waveCtx.beginPath();
        waveCtx.roundRect(x, y, barWidth, bh, r);
        waveCtx.fill();
      }

      waveAnimId = requestAnimationFrame(drawWave);
    }

    function setWaveMode(mode) {
      waveMode = mode;
      iconWrap.classList.toggle("is-playing", mode !== "idle");
      if (mode !== "idle" && !waveAnimId) {
        waveAnimId = requestAnimationFrame(drawWave);
      }
    }

    function applyAppearance() {
      const isLight = currentTheme === "light";
      document.body.classList.toggle("light", isLight);
      themeIcon.innerHTML = isLight ? MOON_SVG : SUN_SVG;
      themeLabel.textContent = isLight ? "Dark" : "Light";

      const p = COLOR_PALETTES[currentColor] || COLOR_PALETTES.cyan;
      const root = document.documentElement.style;
      root.setProperty("--accent", p.accent);
      root.setProperty("--accent-hover", p.hover);
      root.setProperty("--accent-text", p.text);
      root.setProperty("--bg-glow", isLight ? p.glowLight : p.glowDark);

      document.querySelectorAll(".swatch").forEach((el) => {
        el.classList.toggle("active", el.dataset.color === currentColor);
      });
    }

    function toggleTheme() {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      applyAppearance();
    }

    function setColor(name) {
      if (!COLOR_PALETTES[name]) return;
      currentColor = name;
      applyAppearance();
    }

    function openAbout() {
      aboutModal.classList.add("open");
    }

    function closeAbout() {
      aboutModal.classList.remove("open");
    }

    function closeAboutBackdrop(e) {
      if (e.target === aboutModal) {
        closeAbout();
      }
    }

    function setStatus(state, label) {
      statusText.textContent = label;
      statusDot.className = "dot" + (state ? " " + state : "");
    }

    function playStream() {
      isStoppedByUser = false;
      triedFallback = false;
      playBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus("loading", "Connecting...");
      setWaveMode("loading");
      audio.src = PRIMARY_URL;
      audio.load();
      audio.play().catch(() => {
        tryFallback();
      });
    }

    function tryFallback() {
      if (isStoppedByUser || triedFallback) {
        setStatus("", "Stream unavailable");
        setWaveMode("idle");
        playBtn.disabled = false;
        stopBtn.disabled = true;
        return;
      }
      triedFallback = true;
      setStatus("loading", "Reconnecting...");
      setWaveMode("loading");
      audio.src = FALLBACK_URL;
      audio.load();
      audio.play().catch(() => {
        setStatus("", "Stream unavailable");
        setWaveMode("idle");
        playBtn.disabled = false;
        stopBtn.disabled = true;
      });
    }

    function stopStream() {
      isStoppedByUser = true;
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      playBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus("", "Stopped");
      setWaveMode("idle");
    }

    function setVolume(val) {
      audio.volume = parseFloat(val);
    }

    audio.addEventListener("playing", () => {
      if (!isStoppedByUser) {
        setStatus("live", "Playing Live");
        setWaveMode("live");
      }
    });

    audio.addEventListener("waiting", () => {
      if (!isStoppedByUser) {
        setStatus("loading", "Buffering...");
        setWaveMode("loading");
      }
    });

    audio.addEventListener("error", () => {
      if (!isStoppedByUser) {
        tryFallback();
      }
    });

    applyAppearance();
  </script>
</body>
</html>
